# Optional disposable CPU database only. No model/GPU service or public port.
name: pi-e2e12-ci
services:
  pg:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-cpu-only
      POSTGRES_DB: e2e12
    ports: ["127.0.0.1:19384:5432"]
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d e2e12"]
      interval: 2s
      timeout: 2s
      retries: 30
