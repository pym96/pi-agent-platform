worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 2048; }
http {
  log_format receipt escape=json '{"at":"$msec","method":"$request_method","uri":"$request_uri","request_id":"$http_x_request_id","status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status","seconds":$request_time}';
  access_log /dev/stdout receipt;
  proxy_temp_path /tmp/proxy;
  client_body_temp_path /tmp/body;
  server {
    listen 8080;
    client_max_body_size 32k;
    location / {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_buffering off;
      proxy_cache off;
      proxy_next_upstream off;
      proxy_read_timeout 60s;
    }
  }
}
