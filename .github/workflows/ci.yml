name: Pi Qwen CPU contracts
on:
  pull_request:
    paths: ['service/**', '.github/workflows/ci.yml']
  push:
    branches: [main, 'workorder/**']
    paths: ['service/**', '.github/workflows/ci.yml']
permissions:
  contents: read
concurrency:
  group: pi-cpu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-cpu-only
          POSTGRES_DB: e2e12
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e12"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:local-cpu-only@127.0.0.1:5432/e2e12?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: service/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: service/pi/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix service/pi --ignore-scripts
      - run: python -m pip install -r service/inference/requirements-test.txt 'psycopg[binary]==3.2.10'
      - name: Required CPU suites and real SDK to PG chain
        run: python service/scripts/pi-qwen-e2e/run.py --out "$RUNNER_TEMP/pi-e2e12-cpu"
      - name: Preserve original diagnostics and identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-e2e12-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-e2e12-cpu
          if-no-files-found: error
          retention-days: 14
