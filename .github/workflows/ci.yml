name: Pi Qwen CPU contracts
on:
  push:
    branches: [main, workorder/24-candidate]
    paths: ['service/**', 'docs/evidence/pi-qwen-e2e-20261031/**', 'docs/evidence/pi-qwen-load-20261107/**', 'docs/evidence/vllm-compat-20261111/**', 'docs/evidence/pi-vllm-serve-20261111/**', '.github/workflows/ci.yml']
permissions:
  contents: read
concurrency:
  group: pi-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-cpu-only
          POSTGRES_DB: e2e12
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e12"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:local-cpu-only@127.0.0.1:5432/e2e12?sslmode=disable
      NG_PROJECT: pi-ng15-ci
      NG_OWNER: ci
      SOURCE_SHA: ${{ github.sha }}
      NG_HOST_TEST_DATABASE_URL: postgres://pan:isolated-cpu-only@127.0.0.1:18204/ng_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: service/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: service/pi/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Server Python timestamp compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/python310-analyzer"
          python --version > "$RUNNER_TEMP/python310-analyzer/version.txt"
          python service/scripts/pi-qwen-e2e/measurement_gate.py --out "$RUNNER_TEMP/python310-analyzer/summary.json" > "$RUNNER_TEMP/python310-analyzer/tests.log" 2>&1
      - name: Required server Python3.10 full isolated vLLM guards
        run: |
          mkdir -p "$RUNNER_TEMP/python310-vllm21/tmp"
          export TMPDIR="$RUNNER_TEMP/python310-vllm21/tmp"
          python --version > "$RUNNER_TEMP/python310-vllm21/version.txt"
          python service/scripts/nginx-entry/strict_suite.py --start-dir service/scripts/vllm-compat --pattern 'test_*.py' --out "$RUNNER_TEMP/python310-vllm21/summary.json" > "$RUNNER_TEMP/python310-vllm21/tests.log" 2>&1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exclusive hosted runner disk
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$RUNNER_TEMP/ng-preflight"
          df -B1 "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ng-preflight/disk-before.txt"
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$available" -lt 21474836480 ] && [ -d /usr/local/lib/android ]; then
            sudo du -sb /usr/local/lib/android | tee "$RUNNER_TEMP/ng-preflight/removed-sdk-size.txt"
            sudo rm -rf -- /usr/local/lib/android
          fi
          df -B1 "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ng-preflight/disk-after.txt"
      - name: Pinned CPU dependencies
        run: |
          npm ci --prefix service/pi --ignore-scripts
          python -m pip install -r service/inference/requirements-test.txt 'psycopg[binary]==3.2.10'
          python -m pip install --target "$RUNNER_TEMP/ng-deps" -r service/inference/requirements-test.txt
          echo "NODE_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")" >> "$GITHUB_ENV"
          echo "PI_MODULES=$GITHUB_WORKSPACE/service/pi/node_modules" >> "$GITHUB_ENV"
          echo "NG_DEPS=$RUNNER_TEMP/ng-deps" >> "$GITHUB_ENV"
          docker pull python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          docker pull nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
      - name: Required opt-in vLLM serving ownership and entry checks
        run: |
          mkdir -p "$RUNNER_TEMP/vllm24"
          export G2_TEST_EVIDENCE="$RUNNER_TEMP/vllm24/raw"
          python service/scripts/nginx-entry/strict_suite.py --start-dir service/scripts/vllm-serve --pattern 'test_*.py' --out "$RUNNER_TEMP/vllm24/summary.json" > "$RUNNER_TEMP/vllm24/tests.log" 2>&1
      - name: Required isolated vLLM CPU guards and closure checker
        run: |
          mkdir -p "$RUNNER_TEMP/vllm21"
          python service/scripts/nginx-entry/strict_suite.py --start-dir service/scripts/vllm-compat --pattern 'test_*.py' --out "$RUNNER_TEMP/vllm21/summary.json" > "$RUNNER_TEMP/vllm21/tests.log" 2>&1
      - name: Required terminal-aware load measurement CLI
        run: |
          mkdir -p "$RUNNER_TEMP/load13"
          export MONITOR_TEST_EVIDENCE="$RUNNER_TEMP/load13/raw/monitor"
          export LOAD_TEST_EVIDENCE="$RUNNER_TEMP/load13/raw/load"
          export PAIR_TEST_EVIDENCE="$RUNNER_TEMP/load13/raw/pairs"
          python service/scripts/nginx-entry/strict_suite.py --start-dir service/scripts/pi-qwen-load --pattern 'test_*.py' --out "$RUNNER_TEMP/load13/summary.json" > "$RUNNER_TEMP/load13/tests.log" 2>&1
      - name: Required CPU suites and actual SDK to PG chain
        run: python service/scripts/pi-qwen-e2e/run.py --out "$RUNNER_TEMP/pi-e2e12-cpu"
      - name: Stop dedicated E2E PostgreSQL before Nginx phase
        if: always()
        run: docker stop --time 5 '${{ job.services.postgres.id }}'
      - name: Required actual Docker watchdog cleanup CLI
        run: |
          mkdir -p "$RUNNER_TEMP/watch-cleanup-tests"
          export WATCH_CLI_EVIDENCE="$RUNNER_TEMP/watch-cleanup-tests/raw"
          python service/scripts/nginx-entry/strict_suite.py --start-dir service/scripts/pi-qwen-e2e --pattern test_watch_cli.py --out "$RUNNER_TEMP/watch-cleanup-tests/summary.json"
      - name: Current Product Nginx actual platform, lab and strict suites
        run: python service/scripts/nginx-entry/run.py --build-host --out "$RUNNER_TEMP/ng-entry"
      - name: Preserve original diagnostics and identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-e2e12-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pi-e2e12-cpu
            !${{ runner.temp }}/pi-e2e12-cpu/api
            ${{ runner.temp }}/ng-entry
            ${{ runner.temp }}/ng-preflight
            ${{ runner.temp }}/watch-cleanup-tests
            ${{ runner.temp }}/python310-analyzer
            ${{ runner.temp }}/python310-vllm21
            ${{ runner.temp }}/load13
            ${{ runner.temp }}/vllm21
            ${{ runner.temp }}/vllm24
          if-no-files-found: error
          retention-days: 14
